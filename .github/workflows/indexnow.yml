# Twice a week (Tuesday and Saturday), tell the IndexNow engines (Bing, Yandex, …) which pages the live site has; and by
# hand (Actions → IndexNow → Run workflow). Not on every deploy: each run costs Actions minutes.
# At most once a day: the cache key holds the date, so later runs on the same day skip the call.
name: IndexNow

on:
  # Off until thenahwi.com is live and INDEXING is on (docs/setup-new-site.md): remove the # of the next two lines to turn it on.
  # schedule:
  #   - cron: "17 5 * * 2,6"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - id: done
        uses: actions/cache@v4
        with:
          path: .indexnow-done
          key: indexnow-${{ steps.day.outputs.date }}
      - if: steps.done.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.done.outputs.cache-hit != 'true'
        run: node scripts/indexnow.mjs && touch .indexnow-done
